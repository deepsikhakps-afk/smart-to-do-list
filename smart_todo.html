<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart To-Do with Reminders</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; letter-spacing: 1px; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 14px; }

  .card {
    background: #22223a;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }

  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input, select, button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #3d3d5c;
    background: #14141f;
    color: #fff;
    padding: 8px 10px;
  }
  input[type="text"] { flex: 1 1 200px; }
  input[type="date"], input[type="time"] { flex: 1 1 130px; }
  select { flex: 1 1 120px; }

  #addBtn {
    background: #4caf50;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 10px 18px;
  }
  #addBtn:hover { background: #43a047; }

  .filters { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .filters button {
    background: #2d2d4a;
    cursor: pointer;
    padding: 6px 14px;
  }
  .filters button.active { background: #4caf50; }

  ul#taskList { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #2a2a45;
    border-left: 4px solid #4caf50;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: grab;
  }
  .task.priority-high { border-left-color: #ff5252; }
  .task.priority-medium { border-left-color: #ffb300; }
  .task.priority-low { border-left-color: #4caf50; }
  .task.completed { opacity: 0.5; }
  .task.completed .task-title { text-decoration: line-through; }
  .task.dragging { opacity: 0.3; }

  .task-check {
    width: 20px; height: 20px; cursor: pointer; accent-color: #4caf50; flex-shrink: 0;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; word-break: break-word; }
  .task-meta { font-size: 12px; color: #aaa; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .task-meta .overdue { color: #ff5252; font-weight: 600; }
  .recur-badge {
    background: #3d3d5c; padding: 1px 6px; border-radius: 4px; font-size: 11px;
  }
  .task-delete {
    background: transparent; border: none; color: #ff5252; font-size: 18px; cursor: pointer; padding: 2px 6px;
  }

  .empty-state { text-align: center; color: #777; padding: 30px 0; font-size: 14px; }
  #notifStatus { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 10px; }
  #notifStatus button {
    background: #4caf50; border: none; cursor: pointer; padding: 4px 10px; margin-left: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>✅ Smart To-Do</h1>
  <div class="subtitle">Priorities, due dates, recurring tasks & reminders</div>

  <div id="notifStatus"></div>

  <div class="card">
    <div class="form-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?">
    </div>
    <div class="form-row">
      <select id="priorityInput">
        <option value="high">High Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="low">Low Priority</option>
      </select>
      <input type="date" id="dateInput">
      <input type="time" id="timeInput">
      <select id="recurInput">
        <option value="none">No Repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
      <button id="addBtn">Add Task</button>
    </div>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
    <button data-filter="high">High Priority</button>
  </div>

  <ul id="taskList"></ul>
  <div class="empty-state" id="emptyState">No tasks yet. Add one above!</div>
</div>

<script>
const STORAGE_KEY = 'smartTodoTasks';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentFilter = 'all';
let draggedId = null;
let notifiedIds = new Set();

const taskList = document.getElementById('taskList');
const emptyState = document.getElementById('emptyState');
const notifStatus = document.getElementById('notifStatus');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function setupNotifications() {
  if (!('Notification' in window)) {
    notifStatus.textContent = 'Browser notifications not supported here.';
    return;
  }
  if (Notification.permission === 'granted') {
    notifStatus.textContent = '🔔 Reminders enabled';
  } else if (Notification.permission === 'denied') {
    notifStatus.textContent = '🔕 Notifications blocked in browser settings';
  } else {
    notifStatus.innerHTML = 'Enable reminders to get notified when tasks are due';
    const btn = document.createElement('button');
    btn.textContent = 'Enable';
    btn.onclick = () => {
      Notification.requestPermission().then(setupNotifications);
    };
    notifStatus.appendChild(btn);
  }
}

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  tasks.forEach(t => {
    if (t.completed || !t.date || notifiedIds.has(t.id)) return;
    const due = new Date(`${t.date}T${t.time || '23:59'}`);
    if (due <= now && due > new Date(now - 60000)) {
      new Notification('Task Due: ' + t.title, {
        body: `Priority: ${t.priority.toUpperCase()}`,
      });
      notifiedIds.add(t.id);
    } else if (due <= now) {
      notifiedIds.add(t.id); // avoid spamming for already-overdue on load
    }
  });
}

function addTask() {
  const title = document.getElementById('taskInput').value.trim();
  if (!title) return;
  const task = {
    id: uid(),
    title,
    priority: document.getElementById('priorityInput').value,
    date: document.getElementById('dateInput').value,
    time: document.getElementById('timeInput').value,
    recur: document.getElementById('recurInput').value,
    completed: false,
    createdAt: Date.now()
  };
  tasks.unshift(task);
  save();
  document.getElementById('taskInput').value = '';
  document.getElementById('dateInput').value = '';
  document.getElementById('timeInput').value = '';
  render();
}

function toggleComplete(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;

  if (t.completed && t.recur !== 'none' && t.date) {
    const next = new Date(t.date + 'T00:00:00');
    if (t.recur === 'daily') next.setDate(next.getDate() + 1);
    if (t.recur === 'weekly') next.setDate(next.getDate() + 7);
    const newTask = {
      ...t,
      id: uid(),
      completed: false,
      date: next.toISOString().slice(0, 10),
      createdAt: Date.now()
    };
    tasks.unshift(newTask);
  }
  save();
  render();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
}

function isOverdue(t) {
  if (!t.date || t.completed) return false;
  const due = new Date(`${t.date}T${t.time || '23:59'}`);
  return due < new Date();
}

function formatMeta(t) {
  let parts = [];
  if (t.date) {
    let str = new Date(t.date + 'T00:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric'});
    if (t.time) str += ' ' + t.time;
    parts.push(isOverdue(t) ? `<span class="overdue">⚠ ${str}</span>` : str);
  }
  if (t.recur !== 'none') {
    parts.push(`<span class="recur-badge">🔁 ${t.recur}</span>`);
  }
  return parts.join(' &middot; ');
}

function render() {
  let filtered = tasks;
  if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
  else if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);
  else if (currentFilter === 'high') filtered = tasks.filter(t => t.priority === 'high' && !t.completed);

  taskList.innerHTML = '';
  emptyState.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(t => {
    const li = document.createElement('li');
    li.className = `task priority-${t.priority}${t.completed ? ' completed' : ''}`;
    li.draggable = true;
    li.dataset.id = t.id;

    li.innerHTML = `
      <input type="checkbox" class="task-check" ${t.completed ? 'checked' : ''}>
      <div class="task-info">
        <div class="task-title"></div>
        <div class="task-meta">${formatMeta(t)}</div>
      </div>
      <button class="task-delete">✕</button>
    `;
    li.querySelector('.task-title').textContent = t.title;
    li.querySelector('.task-check').addEventListener('change', () => toggleComplete(t.id));
    li.querySelector('.task-delete').addEventListener('click', () => deleteTask(t.id));

    li.addEventListener('dragstart', () => {
      draggedId = t.id;
      li.classList.add('dragging');
    });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', (e) => e.preventDefault());
    li.addEventListener('drop', () => {
      if (draggedId === t.id) return;
      const fromIdx = tasks.findIndex(x => x.id === draggedId);
      const toIdx = tasks.findIndex(x => x.id === t.id);
      const [moved] = tasks.splice(fromIdx, 1);
      tasks.splice(toIdx, 0, moved);
      save();
      render();
    });

    taskList.appendChild(li);
  });
}

document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});
document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

setupNotifications();
render();
setInterval(checkReminders, 30000);
checkReminders();
</script>
</body>
</html>
